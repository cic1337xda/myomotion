server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Clean URL / Micro-Link Routing
    location = / {
        try_files /index.html =404;
    }

    location = /rehab {
        try_files /rehab.html =404;
    }

    location = /settings {
        try_files /settings.html =404;
    }

    location = /history {
        try_files /history.html =404;
    }

    location = /login {
        try_files /login.html =404;
    }

    location = /privacy {
        try_files /privacy.html =404;
    }

    # Static Assets
    location / {
        try_files $uri $uri/ =404;
    }

    # Custom 404 Error Page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Reverse Proxy to FastAPI Backend API
    location /api/ {
        proxy_pass http://myomotion_backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse Proxy for High-Speed WebSockets
    location /ws/ {
        proxy_pass http://myomotion_backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
